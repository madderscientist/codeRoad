<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <title>谱聚类测试</title>
    <style>
        body { font-family: Arial, sans-serif; }
        canvas { border: 1px solid #333; margin-top: 20px; }
        #runBtn { margin-top: 10px; }
    </style>
</head>
<body>
    <h2>谱聚类测试</h2>
    <button id="runBtn">生成并聚类</button>
    <canvas id="clusterCanvas" width="600" height="600"></canvas>
    <script src="triangleMatrix.js"></script>
    <script src="SpectralClustering.js"></script>
    <script>
        // 生成三个簇，重心固定，方差不同
        function generateFixedCentersVariedVariance() {
            const canvasCenter = { x: 300, y: 300 };
            const centers = [
                { x: -80, y: 70 },
                { x: 80, y: 70 },
                { x: 60, y: -80 }
            ];
            const variances = [18,30,20]; // 每个簇的方差
            const numClusters = centers.length;
            const points = [];
            const labels = [];
            const feats = [];
            for (let c = 0; c < numClusters; c++) {
                const n = 80; // 每簇点数
                for (let i = 0; i < n; i++) {
                    // 高斯分布采样
                    const angle = Math.random() * Math.PI * 2;
                    const r = Math.sqrt(-2 * Math.log(Math.random())) * variances[c];
                    const x = centers[c].x + r * Math.cos(angle);
                    const y = centers[c].y + r * Math.sin(angle);
                    // 幅度归一化（用于画布显示）
                    // const norm = Math.sqrt(x * x + y * y);
                    const norm = 100;
                    let x_norm = 0, y_norm = 0;
                    if (norm > 1e-8) {
                        x_norm = x / norm;
                        y_norm = y / norm;
                    }
                    // feats用于聚类，points用于画布显示（归一化后放大到半径200）
                    feats.push(new Float32Array([x_norm, y_norm]));
                    points.push({ x: canvasCenter.x + x_norm * 200, y: canvasCenter.y + y_norm * 200 });
                    labels.push(c);
                }
            }
            return { points, labels, feats, numClusters, canvasCenter };
        }

        // 绘制聚类结果
        function drawClusters(points, clusterIds, canvasCenter) {
            const canvas = document.getElementById("clusterCanvas");
            const ctx = canvas.getContext("2d");
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // 标注原点
            ctx.beginPath();
            ctx.arc(canvasCenter.x, canvasCenter.y, 8, 0, Math.PI * 2);
            ctx.fillStyle = "#222";
            ctx.globalAlpha = 1.0;
            ctx.fill();
            ctx.font = "bold 16px Arial";
            ctx.fillText("原点", canvasCenter.x + 10, canvasCenter.y - 10);
            // 绘制点
            const palette = ["#e74c3c", "#3498db", "#2ecc71", "#f1c40f", "#9b59b6", "#1abc9c"];
            for (let i = 0; i < points.length; i++) {
                ctx.beginPath();
                ctx.arc(points[i].x, points[i].y, 5, 0, Math.PI * 2);
                ctx.fillStyle = palette[clusterIds[i] % palette.length];
                ctx.globalAlpha = 0.8;
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }

        // 聚类并绘制
        function runClustering() {
            const { points, feats, numClusters, canvasCenter } = generateFixedCentersVariedVariance();
            // 聚类，直接获得每个点的类别标签
            console.time("SpectralClustering");
            const labels = SpectralClustering(feats, numClusters);
            console.timeEnd("SpectralClustering");
            console.log("Cluster labels:", points.length);
            drawClusters(points, labels, canvasCenter);
        }

        document.getElementById("runBtn").onclick = runClustering;
        // 初始自动运行一次
        runClustering();
    </script>
</body>
</html>
